<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge Runner</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-day">
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div id="score-container">Score: <span id="score">0</span></div>
            <div id="level-container">Level: <span id="level">1</span></div>
            <div id="powerup-status"></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Dodge Runner</h1>
            <p>Use Arrow Keys or A/D to move</p>
            <div class="theme-selector">
                <label>Select Theme:</label>
                <select id="theme-select">
                    <option value="day">Sunny Day</option>
                    <option value="night">Starry Night</option>
                    <option value="space">Deep Space</option>
                    <option value="underwater">Underwater</option>
                </select>
            </div>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>Game Over</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <div id="leaderboard-container">
                <h3>Leaderboard</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
