<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dodge Runner</title>
    <link rel="icon" href="./favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        @media (max-width: 768px) {
            body {
                padding: 0;
                margin: 0;
            }
            #game-container {
                width: 100vw;
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body class="theme-day">
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div id="score-container">Score: <span id="score">0</span></div>
            <div id="level-container">Level: <span id="level">1</span></div>
            <div id="powerup-status"></div>
            <button id="pause-btn" class="hidden">⏸</button>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay hidden">
            <h1>Paused</h1>
            <p>Game is paused</p>
            <button id="resume-btn">▶ Resume</button>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Dodge Runner</h1>
            <p>Use Arrow Keys or A/D to move</p>
            <div class="theme-selector">
                <label>Select Theme:</label>
                <select id="theme-select">
                    <option value="day">Sunny Day</option>
                    <option value="night">Starry Night</option>
                    <option value="space">Deep Space</option>
                    <option value="underwater">Underwater</option>
                </select>
            </div>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>Game Over</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <div id="leaderboard-container">
                <h3>Leaderboard</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <button id="restart-btn">Play Again</button>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="mobile-controls" class="mobile-controls hidden">
            <div class="touch-zone left-zone" id="left-zone"></div>
            <div class="touch-zone right-zone" id="right-zone"></div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
